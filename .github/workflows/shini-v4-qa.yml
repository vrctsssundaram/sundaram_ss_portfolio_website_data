name: SHINI v4 Clean-room QA
on:
  pull_request:
    paths: ['app/shini/**','.github/workflows/shini-v4-qa.yml']
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Architecture and syntax gate
        shell: bash
        run: |
          set -euo pipefail
          for f in index.html styles.css app-core.js ui-cloud.js app-ui.js sw.js manifest.webmanifest assets/shini-logo.png; do test -f "app/shini/$f"; done
          test ! -e app/shini/runtime
          ! grep -R --line-number -E 'DecompressionStream|\beval\s*\(|/hiden/vasu/|runtime/core/' app/shini
          ! grep -R --line-number -E 'Your VASU|Central VASU|open VASU|Value Asset Stewardship' app/shini
          grep -q 'shini-auth' app/shini/app-core.js
          grep -q 'Your SHINI password' app/shini/index.html
          grep -q 'Surplus, Holdings, Indebtedness, Net Worth &amp; Impairment' app/shini/index.html
          grep -q "balanceImpactApplied===false)return" app/shini/app-ui.js
          grep -q 'KEEP_BOTH' app/shini/app-core.js
          node --check app/shini/app-core.js
          node --check app/shini/ui-cloud.js
          node --check app/shini/app-ui.js
          node --check app/shini/sw.js
      - name: HTTP and real browser smoke
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8765 >/tmp/shini-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          ready=0
          for i in $(seq 1 40); do if curl -fsS http://127.0.0.1:8765/app/shini/ >/dev/null; then ready=1; break; fi; sleep .25; done
          test "$ready" = 1
          for u in /app/shini/styles.css /app/shini/app-core.js /app/shini/ui-cloud.js /app/shini/app-ui.js /app/shini/assets/shini-logo.png; do curl -fsS "http://127.0.0.1:8765$u" >/dev/null; done
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -n "$CHROME" ]; then
            timeout 45s "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=2500 --dump-dom http://127.0.0.1:8765/app/shini/ >/tmp/shini-dom.html
            python3 - <<'PY'
          from pathlib import Path
          t=Path('/tmp/shini-dom.html').read_text(errors='ignore')
          assert 'SHINI' in t
          assert 'Your SHINI username' in t
          assert 'Your SHINI password' in t
          assert 'Unable to open SHINI' not in t
          assert 'VASU' not in t
          print('SHINI v4 browser smoke PASS')
          PY
          fi
