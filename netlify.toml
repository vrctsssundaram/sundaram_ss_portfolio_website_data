[build]
  publish = "."

[context.production]
  publish = "."

[context.deploy-preview]
  publish = "."

[[headers]]
  for = "/app/shini/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    X-Robots-Tag = "noindex, nofollow, noarchive, nosnippet"
