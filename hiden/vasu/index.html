<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B1C2E">
  <title>VASU — Value &amp; Asset Stewardship Utility</title>
  <style>
    html,body{margin:0;background:#0B1C2E;color:#F2EDE4;font-family:system-ui,sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center}
    .b{padding:24px;text-align:center;max-width:680px}
    .g{width:34px;height:34px;border:2px solid #2A3F55;border-top-color:#C9A84C;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}
    @keyframes s{to{transform:rotate(360deg)}}
    .muted{margin-top:8px;color:#A8B0B8;font-size:12px;line-height:1.5}
  </style>
</head>
<body>
<div id="boot"><div class="b"><div class="g"></div><strong>VASU</strong><div class="muted">Opening private stewardship console…</div></div></div>
<script>
(async()=>{
  try{
    const base='/hiden/vasu/payload/';
    const paths=[];
    for(let i=0;i<14;i++) paths.push(base+String(i).padStart(2,'0')+'.txt');
    for(let i=1;i<=16;i++) paths.push(base+'14/'+String(i).padStart(2,'0')+'.txt');

    const chunks=[];
    for(const p of paths){
      const r=await fetch(p,{cache:'no-store'});
      if(!r.ok) throw new Error('Core payload unavailable: '+p+' ('+r.status+')');
      chunks.push(await r.text());
    }

    const b64=chunks.join('').replace(/\s+/g,'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('This browser needs DecompressionStream support.');
    const ds=new DecompressionStream('gzip');
    let html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
    html=html.split('Value Asset Stewardship Utility').join('Value & Asset Stewardship Utility');

    const lr=await fetch(base+'logo.b64',{cache:'no-store'});
    if(lr.ok){
      const logo=(await lr.text()).replace(/\s+/g,'');
      html=html.replace(/<img src="data:image\/jpeg;base64,[^"]+" alt="VASU emblem" class="vasu-logo" \/>/,`<img src="data:image/webp;base64,${logo}" alt="VASU emblem" class="vasu-logo" />`);
      const brand=`<style>.brand-mark{background-color:transparent!important;background-image:url("data:image/webp;base64,${logo}")!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important;color:transparent!important;border:0!important;box-shadow:none!important}.sidebar-brand .brand-mark.small{width:32px!important;height:46px!important;border-radius:8px!important}</style>`;
      html=html.replace('</head>',brand+'</head>');
    }

    const [rr,hr,br,pr,nr]=await Promise.all([
      fetch(base+'vasu-v24-runtime.js',{cache:'no-store'}),
      fetch(base+'vasu-v24-import-hotfix.js',{cache:'no-store'}),
      fetch(base+'vasu-v25-bulk-ui.js',{cache:'no-store'}),
      fetch(base+'vasu-v26-polish.js',{cache:'no-store'}),
      fetch(base+'vasu-v27-navigation.js',{cache:'no-store'})
    ]);
    if(!rr.ok || !hr.ok || !br.ok || !pr.ok || !nr.ok){
      throw new Error(`VASU runtime unavailable (central ${rr.status}, import ${hr.status}, bulk UI ${br.status}, polish ${pr.status}, navigation ${nr.status})`);
    }
    const patch=(await rr.text())+'\n'+(await hr.text())+'\n'+(await br.text())+'\n'+(await pr.text())+'\n'+(await nr.text());
    const marker='init().catch(e=>{console.error(e);alert(`Initialization failed: ${e.message}`)});';
    if(!html.includes(marker)) throw new Error('VASU runtime marker mismatch');
    html=html.replace(marker,patch+'\n'+marker);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    console.error('VASU boot failure',e);
    const el=document.getElementById('boot');
    if(el) el.innerHTML='<div class="b"><strong>Unable to open VASU</strong><div class="muted">'+String(e.message||e)+'</div></div>';
  }
})();
</script>
</body>
</html>
