<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex"><meta name="theme-color" content="#0B1C2E"><title>VASU — Value Asset Stewardship Utility</title><style>html,body{margin:0;background:#0B1C2E;color:#F2EDE4;font-family:system-ui,sans-serif}#boot{min-height:100vh;display:grid;place-items:center}.b{padding:24px;text-align:center}.g{width:34px;height:34px;border:2px solid #2A3F55;border-top-color:#C9A84C;border-radius:50%;animation:s 1s linear infinite;margin:0 auto 14px}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div id="boot"><div class="b"><div class="g"></div><strong>VASU</strong><div style="margin-top:6px;color:#A8B0B8;font-size:12px">Opening private stewardship console…</div></div></div><script>(async()=>{try{const n=15,a=[];for(let i=0;i<n;i++){const r=await fetch(`.payload/${String(i).padStart(2,'0')}.txt`,{cache:'no-store'});if(!r.ok)throw new Error('payload '+i);a.push(await r.text())}const bin=Uint8Array.from(atob(a.join('')),c=>c.charCodeAt(0));if(!('DecompressionStream'in window))throw new Error('This browser needs DecompressionStream support.');const ds=new DecompressionStream('gzip');const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('boot').innerHTML='<div class="b"><strong>Unable to open VASU</strong><div style="margin-top:8px;color:#A8B0B8">'+String(e.message||e)+'</div></div>'}})();</script></body></html>
