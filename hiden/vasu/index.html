<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="googlebot" content="noindex,nofollow,noarchive,nosnippet,noimageindex">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#0B1C2E">
  <title>VASU — Value &amp; Asset Stewardship Utility</title>
  <style>
    html,body{margin:0;background:#0B1C2E;color:#F2EDE4;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    #boot{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 50% 38%,rgba(201,168,76,.08),transparent 34%),#0B1C2E;overflow:hidden}
    .b{width:min(520px,calc(100vw - 42px));padding:28px;text-align:center;position:relative}
    .boot-logo{width:70px;height:92px;object-fit:contain;margin:0 auto 12px;filter:drop-shadow(0 10px 28px rgba(0,0,0,.35));opacity:0;transform:translateY(6px);transition:.35s ease}
    .boot-logo.ready{opacity:1;transform:none}
    .boot-fallback{width:62px;height:62px;margin:0 auto 18px;border:1px solid #3A4653;border-radius:18px;display:grid;place-items:center;color:#C9A84C;font-weight:800;font-size:22px;background:#0E1117}
    .brand{font-size:22px;font-weight:800;letter-spacing:.18em;margin-left:.18em}.full{font-size:10px;color:#A8B0B8;letter-spacing:.07em;text-transform:uppercase;margin-top:5px}
    .equation{display:flex;justify-content:center;gap:15px;margin:19px 0 15px;color:#C9A84C;font:600 13px ui-monospace,SFMono-Regular,Menlo,monospace;opacity:.8}.equation span:nth-child(even){color:#7F8A95}
    .boot-status{font-size:12px;min-height:18px;color:#E5E0D8}.boot-detail{margin-top:5px;color:#84909C;font-size:10px;line-height:1.5}
    .track{height:3px;background:#1D3042;border-radius:99px;margin:16px auto 0;overflow:hidden;max-width:360px}.fill{height:100%;width:4%;background:linear-gradient(90deg,#8C7538,#C9A84C,#E0C87A);border-radius:99px;transition:width .28s ease}
    .trust{margin-top:15px;display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.trust span{border:1px solid #263C50;border-radius:999px;padding:4px 8px;color:#82909D;font-size:9px}
    .orb{position:absolute;width:220px;height:220px;border:1px solid rgba(201,168,76,.055);border-radius:50%;left:50%;top:29%;transform:translate(-50%,-50%);animation:p 3.8s ease-in-out infinite}.orb:after,.orb:before{content:'';position:absolute;inset:24px;border:1px solid rgba(201,168,76,.045);border-radius:50%}.orb:after{inset:52px}@keyframes p{50%{transform:translate(-50%,-50%) scale(1.035);opacity:.62}}
    @media(prefers-reduced-motion:reduce){.orb{animation:none}.fill,.boot-logo{transition:none}}
  </style>
</head>
<body>
<div id="boot"><div class="b"><div class="orb"></div><div id="bootLogoSlot"><div class="boot-fallback">V</div></div><div class="brand">VASU</div><div class="full">Value &amp; Asset Stewardship Utility</div><div class="equation"><span>Σ</span><span>cash flow</span><span>Δ</span><span>trend</span><span>₹</span><span>stewardship</span><span>%</span></div><div id="bootStatus" class="boot-status">Initializing private financial intelligence…</div><div id="bootDetail" class="boot-detail">Encrypted ledger · deterministic analytics · local-first interface</div><div class="track"><div id="bootFill" class="fill"></div></div><div class="trust"><span>Encrypted vault</span><span>Accounting integrity</span><span>Private workspace</span></div></div></div>
<script>
(async()=>{
  const statusPhrases=[
    ['Initializing private financial intelligence…','Establishing the protected VASU workspace'],
    ['Reconciling ledger controls…','Income · expense · repayment · transfer · investment'],
    ['Aligning cash-flow matrices…','Σ flows · Δ trends · period-aware analysis'],
    ['Loading stewardship models…','Budget · liquidity · debt · goals · net worth'],
    ['Preparing financial command centre…','Reports · day book · tools · forecasting'],
    ['Finalizing encrypted workspace…','One central vault · synchronized controls']
  ];
  let phrase=0,progress=3,bootTimer=null;
  const setBoot=(msg,detail)=>{const a=document.getElementById('bootStatus'),b=document.getElementById('bootDetail');if(a&&msg)a.textContent=msg;if(b&&detail)b.textContent=detail};
  const setProgress=v=>{progress=Math.max(progress,Math.min(99,v));const e=document.getElementById('bootFill');if(e)e.style.width=progress+'%'};
  bootTimer=setInterval(()=>{phrase=(phrase+1)%statusPhrases.length;setBoot(...statusPhrases[phrase])},1050);
  try{
    const base='/hiden/vasu/payload/';
    const paths=[];
    for(let i=0;i<14;i++) paths.push(base+String(i).padStart(2,'0')+'.txt');
    for(let i=1;i<=16;i++) paths.push(base+'14/'+String(i).padStart(2,'0')+'.txt');

    const logoPromise=fetch(base+'logo.b64',{cache:'no-store'}).then(async r=>r.ok?(await r.text()).replace(/\s+/g,''):null).catch(()=>null);
    logoPromise.then(logo=>{if(!logo)return;const slot=document.getElementById('bootLogoSlot');if(slot){slot.innerHTML=`<img class="boot-logo" alt="VASU emblem" src="data:image/webp;base64,${logo}">`;requestAnimationFrame(()=>slot.querySelector('img')?.classList.add('ready'))}});

    const chunks=[];
    for(let i=0;i<paths.length;i++){
      const r=await fetch(paths[i],{cache:'no-store'});
      if(!r.ok) throw new Error('Core payload unavailable: '+paths[i]+' ('+r.status+')');
      chunks.push(await r.text());
      setProgress(5+(i+1)/paths.length*54);
    }
    setBoot('Reconstructing encrypted application core…','Verifying compressed runtime modules');
    const b64=chunks.join('').replace(/\s+/g,'');
    const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
    if(!('DecompressionStream' in window)) throw new Error('This browser needs DecompressionStream support.');
    let html=await new Response(new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    html=html.split('Value Asset Stewardship Utility').join('Value & Asset Stewardship Utility');
    setProgress(64);

    const logo=await logoPromise;
    if(logo){
      html=html.replace(/<img src="data:image\/jpeg;base64,[^"]+" alt="VASU emblem" class="vasu-logo" \/>/,`<img src="data:image/webp;base64,${logo}" alt="VASU emblem" class="vasu-logo" />`);
      const brand=`<style>.brand-mark{background-color:transparent!important;background-image:url("data:image/webp;base64,${logo}")!important;background-size:contain!important;background-repeat:no-repeat!important;background-position:center!important;color:transparent!important;border:0!important;box-shadow:none!important}.sidebar-brand .brand-mark.small{width:32px!important;height:46px!important;border-radius:8px!important}</style>`;
      html=html.replace('</head>',brand+'</head>');
    }
    setProgress(68);

    setBoot('Loading synchronized stewardship modules…','Central vault · import integrity · navigation · analysis window');
    const [rr,hr,br,pr,nr,qr,sr]=await Promise.all([
      fetch(base+'vasu-v24-runtime.js',{cache:'no-store'}),
      fetch(base+'vasu-v24-import-hotfix.js',{cache:'no-store'}),
      fetch(base+'vasu-v25-bulk-ui.js',{cache:'no-store'}),
      fetch(base+'vasu-v26-polish.js',{cache:'no-store'}),
      fetch(base+'vasu-v27-navigation.js',{cache:'no-store'}),
      fetch(base+'vasu-v28-qa.b64',{cache:'no-store'}),
      fetch(base+'vasu-v29-suite.b64',{cache:'no-store'})
    ]);
    setProgress(84);
    if(!rr.ok || !hr.ok || !br.ok || !pr.ok || !nr.ok || !qr.ok || !sr.ok){
      throw new Error(`VASU runtime unavailable (central ${rr.status}, import ${hr.status}, bulk ${br.status}, polish ${pr.status}, navigation ${nr.status}, QA ${qr.status}, suite ${sr.status})`);
    }
    const inflate=async r=>{const x=(await r.text()).replace(/\s+/g,'');const bytes=Uint8Array.from(atob(x),c=>c.charCodeAt(0));return new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};
    const [qjs,sjs]=await Promise.all([inflate(qr),inflate(sr)]);
    setProgress(94);setBoot('Binding financial intelligence graph…','Global periods · reports · cash day book · tools · workspace');
    const patch=(await rr.text())+'\n'+(await hr.text())+'\n'+(await br.text())+'\n'+(await pr.text())+'\n'+(await nr.text())+'\n'+qjs+'\n'+sjs;
    const marker='init().catch(e=>{console.error(e);alert(`Initialization failed: ${e.message}`)});';
    if(!html.includes(marker)) throw new Error('VASU runtime marker mismatch');
    html=html.replace(marker,patch+'\n'+marker);
    setProgress(100);setBoot('VASU ready.','Opening your private financial command centre');
    clearInterval(bootTimer);
    setTimeout(()=>{document.open();document.write(html);document.close()},150);
  }catch(e){
    clearInterval(bootTimer);console.error('VASU boot failure',e);
    const el=document.getElementById('boot');
    if(el) el.innerHTML='<div class="b"><div class="boot-fallback">!</div><strong>Unable to open VASU</strong><div class="boot-detail">'+String(e.message||e)+'</div></div>';
  }
})();
</script>
</body>
</html>
