"detail">Central vault · accounting integrity · responsive navigation</div><div class="track"><div id="fl" class="fill"></div></div></div></div><script>(async()=>{const root='/app/shini/runtime/',core=root+'core/',features=root+'features/',set=(m,p)=>{document.getElementById('st').textContent=m;document.getElementById('fl').style.width=p+'%'},inflate=async x=>{const b=Uint8Array.from(atob(String(x).replace(/\s+/g,'')),c=>c.charCodeAt(0));return new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).text()};try{if(!('DecompressionStream'in window))throw new Error('This browser requires modern gzip stream support. Please use a current Safari, Chrome, Edge or Firefox build.');const paths=[];for(let i=0;i<14;i++)paths.push(core+String(i).padStart(2,'0')+'.txt');for(let i=1;i<=16;i++)paths.push(core+'14/'+String(i).padStart(2,'0')+'.txt');const chunks=[];for(let i=0;i<paths.length;i++){const r=await fetch(paths[i],{cache:'reload'});if(!r.ok)throw new Error('Core payload unavailable: '+r.status);chunks.push(await r.text());set('Loading verified application core…',5+Math.round((i+1)/paths.length*46))}let html=await inflate(chunks.join(''));set('Loading synchronization and navigation…',56);const [sync,integrity,bulk,polish,nav,qa,feature29,brand]=await Promise.all([fetch(root+'sync-runtime.js?v=34',{cache:'reload'}),fetch(root+'import-integrity.js?v=34',{cache:'reload'}),fetch(root+'bulk-import-ui.js?v=34',{cache:'reload'}),fetch(root+'interaction-polish.js?v=34',{cache:'reload'}),fetch(root+'responsive-navigation.js?v=34',{cache:'reload'}),fetch(root+'accounting-integrity.b64?v=34',{cache:'reload'}),Promise.all([1,2,3,4,5,6].map(i=>fetch(features+'29/'+String(i).padStart(2,'0')+'.txt?v=34',{cache:'reload'}))),fetch('/app/shini/shini-brand-safe.js?v=34',{cache:'reload'})]);if(![sync,integrity,bulk,polish,nav,qa,brand].every(r=>r.ok)||!feature29.every(r=>r.ok))throw new Error('Verified runtime module unavailable.');set('Binding financial calculations…',76);const qjs=await inflate(await qa.text()),parts=[];for(const r of feature29)parts.push(await r.text());const v29=await inflate(parts.join('')),brandJs=await brand.text();const patch=[await sync.text(),await integrity.text(),await bulk.text(),await polish.text(),await nav.text(),qjs,v29,brandJs].join('\n');const marker='init().catch(e=>{console.error(e);alert(`Initialization failed: ${e.message}`)});';if(!html.includes(marker))throw new Error('Verified runtime marker mismatch.');html=html.replace(marker,patch+'\n'+marker);set('SHINI ready.',100);setTimeout(()=>{document.open();document.write(html);document.close()},80)}catch(e){console.error(e);document.getElementById('boot').innerHTML='<div class="b"><img class="mark" src="/app/shini/assets/shini-logo.png?v=34" alt="SHINI"><strong>Unable to open SHINI</strong><div class="detail">'+String(e.message||e)+'</div></div>'}})();</script></body></html>
